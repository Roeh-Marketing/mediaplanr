url: https://roeh-marketing.github.io/mediaplanr/

template:
  bslib:
    version: 5
    brand: _brand.yml
  light-switch: true

navbar:
  structure:
    left: [intro, reference, articles, news]
    right: [search, github, lightswitch]

articles:
- title: Get going
  contents: getting_started
- title: Understand the model
  contents: plan_concepts

reference:
- title: The plan
  desc: >
    Turn an uploaded table into a validated plan. A plan holds planned spend on
    every row -- intent, never actuals -- at a configurable grain.
  contents:
  - media_plan_from_df
  - MediaPlan

- title: Line items and grain
  desc: >
    A line item is a channel / partner / tactic combination: the time-free
    identity a decomp constrains and response models attach to. The grain
    describes a whole row, which at a weekly grain is a line item for one week.
  contents:
  - line_item
  - line_item_grain
  - line_item_summary
  - grain_values
  - roll_up

- title: Flight dates
  desc: >
    When the plan is in market. Derived from the plan's own rows, so it is true
    of the plan alone -- unlike a decomp's through-date, which belongs to a
    pairing and moves every refresh.
  contents:
  - flight_window
  - week_start

- title: Flighting
  desc: >
    A flight is how a buy is authored -- in-market dates and a total. A week is
    how the plan is held. Build a plan from flights and it expands onto weekly
    rows exactly to the cent; flights() recovers the flights it was authored
    from, and reports none rather than guessing when a plan records no flight
    identity.
  contents:
  - media_plan_from_flights
  - flights
  - flight_cols
  - period_basis_levels
  - pacing_levels

- title: Scenarios
  desc: >
    Derive a new plan by changing spend, then collect the results into a set to
    compare. Deriving never modifies the original, and every scenario records
    the plan it came from.
  contents:
  - build_scenario
  - scenario_set
  - add_scenario
  - compare_scenarios
  - ScenarioSet

- title: Workflow status
  desc: >
    The fixed vocabulary a plan's status is validated against, so a UI dropdown
    and the validator cannot disagree.
  contents:
  - status_levels

- title: Pairing a plan with a decomp
  desc: >
    A plan alone is blind to past and future. Pair it with a decomp -- which
    reports actuals through a date -- and questions about history become
    answerable.
  contents:
  - check_coverage

- title: Utilities
  contents:
  - short_id
  - print
